# TEMPLATE — not active. Copy to .github/workflows/deploy-hostinger.yml in Phase 0 and adapt.
# Untested until Phase 0. Assumes the Laravel app lives in ./platform and a server-side script
# platform/deploy/release.sh exists (see docs/headless/MASTER-PLAN-V3.1-EXPANDED.md §2).
#
# Required secrets (per GitHub Environment: staging / production):
#   SSH_KEY, SSH_HOST, SSH_PORT (65002 shared, 22 VPS), SSH_USER, SSH_KNOWN_HOSTS, PHP_BIN
# NOT stored in GitHub: DB / R2 / PSP / app key — they live only in ~/shared/.env on the server.

name: CI & Deploy (Hostinger)

on:
  pull_request:
    paths: ['platform/**']
  push:
    branches: [develop]                 # auto-deploys to STAGING only
    paths: ['platform/**', '.github/workflows/deploy-hostinger.yml']
  workflow_dispatch:                    # production is manual only
    inputs:
      target:
        description: 'Deploy target'
        type: choice
        options: [staging, production]
        default: staging
      ref:
        description: 'Git ref (tag or SHA) to deploy'
        required: true
        default: develop

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.target || 'staging' }}
  cancel-in-progress: false             # never cancel a running deploy

defaults:
  run:
    working-directory: platform

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:                         # RLS / tenant-isolation tests need real Postgres
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: app_test
      DB_USERNAME: app
      DB_PASSWORD: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, mbstring, intl, gd
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan migrate --force
      - run: ./vendor/bin/pest --ci       # includes cross-tenant attack matrix
      - run: npm ci && npm run build      # fail early if Vite/Puck build breaks

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - id: meta
        working-directory: .
        run: echo "sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, mbstring, intl, gd
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
      - run: npm ci && npm run build
      - name: Package release (no node_modules, tests, .env, git)
        run: |
          tar --exclude='./node_modules' --exclude='./tests' --exclude='./.git' \
              --exclude='./.env' --exclude='./storage/logs/*' \
              -czf ../release-${{ steps.meta.outputs.sha }}.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.meta.outputs.sha }}
          path: release-${{ steps.meta.outputs.sha }}.tgz
          retention-days: 14

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.target || 'staging' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.build.outputs.sha }}
      - name: Configure SSH (pinned host key)
        working-directory: .
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Upload release
        working-directory: .
        run: |
          scp -i ~/.ssh/deploy_key -P "${{ secrets.SSH_PORT }}" \
            release-${{ needs.build.outputs.sha }}.tgz \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:releases/incoming/"
      - name: Activate release (migrate, cache, swap, health-check, auto-rollback)
        working-directory: .
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "PHP_BIN='${{ secrets.PHP_BIN }}' bash ~/shared/bin/release.sh ${{ needs.build.outputs.sha }}"
      - name: Cleanup
        if: always()
        working-directory: .
        run: rm -f ~/.ssh/deploy_key
